name: Build and test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run build

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm test

  test-e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  build-android-apk:
    needs: [test, test-e2e]
    if: ${{ gitea.event_name == 'push' && gitea.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    container:
      image: reactnativecommunity/react-native-android:v20.1
    env:
      CI: 'true'
      NODE_ENV: production
      EXPO_PUBLIC_FASHION_CANVAS_API_URL: ${{ vars.EXPO_PUBLIC_FASHION_CANVAS_API_URL }}
      ANDROID_VERSION_CODE: ${{ gitea.run_number }}
      ANDROID_KEYSTORE_FILE: release.keystore
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - name: Validate Android build configuration
        run: |
          test -n "$EXPO_PUBLIC_FASHION_CANVAS_API_URL"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
      - name: Restore Expo Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          chmod 600 android/app/release.keystore
      - name: Install Android build dependencies
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          'build-tools;35.0.0' 'cmake;3.22.1'
      - name: Build signed release APK locally
        working-directory: android
        run: |
          attempt=1
          until ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx1024m -XX:MaxMetaspaceSize=384m" \
            -Dorg.gradle.parallel=false \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a; do
            if [ "$attempt" -ge 3 ]; then
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "Gradle build failed; retrying (attempt $attempt of 3)."
            sleep 10
          done
      - name: Verify APK signature
        run: >-
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose
          android/app/build/outputs/apk/release/app-release.apk
      - name: Upload signed APK
        uses: ChristopherHX/gitea-upload-artifact@v4
        with:
          name: fashion-canvas-android-${{ gitea.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
